name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Snapaste.sln
      - name: Compile with warnings as errors
        run: dotnet build Snapaste.sln -c Release --no-restore -warnaserror
      - name: Build portable package
        shell: pwsh
        run: ./build.ps1 -Portable
      - uses: actions/upload-artifact@v7
        with:
          name: Snapaste-win-x64
          path: artifacts/Snapaste-*-win-x64.zip
          if-no-files-found: error
          retention-days: 14
